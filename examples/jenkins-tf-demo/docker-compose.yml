services:
  jenkins:
    build: .
    container_name: obs-agent-jenkins-demo
    ports:
      # Loopback only: the UI is reachable from this machine, not from your network.
      # (The container holds AWS credentials, so it must not be reachable by others.)
      # No inbound-agent port is published; this demo runs builds on the controller.
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      # NOTE: the ~/.aws mount is DISABLED on purpose. Isengard profiles use
      # `credential_process = isengardcli`, which does not exist inside the
      # container, so mounting the profile fails with "No such file: isengardcli".
      # We pass static temp keys as env vars instead (set them in your host shell
      # before `docker compose up`). To use a mounted profile with STATIC keys
      # (no credential_process), re-enable this line and set AWS_PROFILE below.
      # - ${HOME}/.aws:/var/jenkins_home/.aws:ro
    environment:
      # Static credentials, read from your HOST shell. Export the real values
      # before running compose (do NOT paste secrets into this file):
      #   export AWS_ACCESS_KEY_ID=ASIA...
      #   export AWS_SECRET_ACCESS_KEY=...
      #   export AWS_SESSION_TOKEN=...      # required for temporary/Isengard creds
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # Jenkins admin login. No default: compose refuses to start until you set it.
      #   read -rs -p "Jenkins admin password: " JENKINS_ADMIN_PASSWORD; export JENKINS_ADMIN_PASSWORD
      - JENKINS_ADMIN_ID=${JENKINS_ADMIN_ID:-admin}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD before docker compose up}
      # AWS_PROFILE intentionally omitted — using static keys above, not a profile.

volumes:
  jenkins_home:
